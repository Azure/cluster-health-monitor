name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore: [docs/**, "**.md", "**.mdx", "**.png", "**.jpg"]

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/oss/go/microsoft/golang:1.26.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/oss/go/microsoft/golang:1.26.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -buildvcs=false --race $(go list -buildvcs=false ./... | grep -v /e2e)

  runtime-trust:
    name: Runtime CA policy (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      RUNTIME_IMAGE: chm-runtime-test
      BASE_IMAGE: chm-runtime-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-amd64
            dockerfile: docker/cluster-health-monitor.Dockerfile
            platform: linux/amd64
          - name: default-arm64
            dockerfile: docker/cluster-health-monitor.Dockerfile
            platform: linux/arm64
          - name: gpu-amd64
            dockerfile: docker/cluster-health-monitor-gpu.Dockerfile
            platform: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build original base and sanitized runtime
        run: |
          docker buildx build --pull --load --target runtime-base \
            --platform "${{ matrix.platform }}" --file "${{ matrix.dockerfile }}" \
            --tag "$BASE_IMAGE" .
          docker buildx build --load --target runtime \
            --platform "${{ matrix.platform }}" --file "${{ matrix.dockerfile }}" \
            --tag "$RUNTIME_IMAGE" .
      - name: Verify all layers, retained CAs, and incident chain rejection
        run: python3 docker/verify-runtime-trust.py

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Microsoft Go
        run: |
          docker pull mcr.microsoft.com/oss/go/microsoft/golang:1.26.10
          docker create --name msgo mcr.microsoft.com/oss/go/microsoft/golang:1.26.10
          docker cp msgo:/usr/local/go "$HOME/microsoft-go"
          docker rm msgo
          echo "$HOME/microsoft-go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      - name: Run E2E tests
        run: ginkgo -v -p --race --skip-file='.*_aks_test\.go' ./test/e2e/
