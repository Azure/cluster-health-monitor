name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore: [docs/**, "**.md", "**.mdx", "**.png", "**.jpg"]

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/oss/go/microsoft/golang:1.26.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/oss/go/microsoft/golang:1.26.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -buildvcs=false --race $(go list -buildvcs=false ./... | grep -v /e2e)

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Microsoft Go
        run: |
          docker pull mcr.microsoft.com/oss/go/microsoft/golang:1.26.6
          docker create --name msgo mcr.microsoft.com/oss/go/microsoft/golang:1.26.6
          docker cp msgo:/usr/local/go "$HOME/microsoft-go"
          docker rm msgo
          echo "$HOME/microsoft-go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      - name: Run E2E tests
        run: ginkgo -v -p --race --skip-file='.*_aks_test\.go' ./test/e2e/
