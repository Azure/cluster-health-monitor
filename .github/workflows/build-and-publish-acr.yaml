# This Github Action will build and publish images to Azure Container Registry(ACR), from where the published images will be automatically
# pushed to the trusted registry, Microsoft Container Registry(MCR).

name: build_and_publish_acr
on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Release tag to publish images, defaults to the latest one'
        type: string
      publishClusterHealthMonitor:
        description: 'Publish cluster-health-monitor'
        required: true
        default: true
        type: boolean
      publishGpuChecker:
        description: 'Publish cluster-health-monitor-gpu'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  # `public` indicates images to MCR wil be publicly available, and will be removed in the final MCR images
  REGISTRY_REPO: public/aks/cluster-health-monitor
  CLUSTER_HEALTH_MONITOR_IMAGE_NAME: cluster-health-monitor
  GPU_CHECKER_IMAGE_NAME: cluster-health-monitor-gpu
jobs:
  prepare-variables:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: 'Set output variables'
      id: vars
      run: |
        # set the image version
        RELEASE_TAG=${{ inputs.releaseTag }}
        if [ -z "$RELEASE_TAG" ]; then
          RELEASE_TAG=`git describe --tags $(git rev-list --tags --max-count=1)`
          echo "The user input release tag is empty, will use the latest tag $RELEASE_TAG."
        fi
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

        # NOTE: As exporting a variable from a secret is not possible, the shared variable registry obtained
        # from AZURE_REGISTRY secret is not exported from here.

  publish-images:
    runs-on:
      labels: [ self-hosted, "1ES.Pool=1es-aks-cluster-health-monitor-pool-ubuntu" ]
    needs: prepare-variables
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare-variables.outputs.release_tag }}

    - name: Show initial disk usage
      run: |
        echo "================ FILESYSTEMS ================"
        df -hT

        echo "================ WORKSPACE FILESYSTEM ================"
        findmnt -T "$GITHUB_WORKSPACE"

        echo "================ DOCKER STORAGE ================"
        docker_root="$(docker info --format '{{.DockerRootDir}}')"
        echo "Docker root: $docker_root"
        findmnt -T "$docker_root"
        df -hT "$docker_root"
        docker system df

    - name: Move Docker storage to temporary disk
      shell: bash
      run: |
        set -euo pipefail

        docker_data_root="/mnt/docker"
        root_device="$(findmnt -n -o SOURCE -T /)"
        temp_device="$(findmnt -n -o SOURCE -T /mnt)"

        echo "Root device: $root_device"
        echo "Temporary disk device: $temp_device"

        if [ "$root_device" = "$temp_device" ]; then
          echo "::error::/mnt is not a separate filesystem"
          exit 1
        fi

        if ! mountpoint -q /mnt; then
          echo "::error::/mnt is not mounted"
          exit 1
        fi

        if ! command -v jq >/dev/null; then
          echo "::error::jq is required to preserve Docker's existing configuration"
          exit 1
        fi

        sudo mkdir -p "$docker_data_root" /etc/docker

        config="$(mktemp)"
        backup="$(mktemp)"
        trap 'rm -f "$config" "$backup"' EXIT

        had_config=false
        if [ -s /etc/docker/daemon.json ]; then
          had_config=true
          sudo cp /etc/docker/daemon.json "$backup"
          jq --arg root "$docker_data_root" \
            '.["data-root"] = $root' \
            /etc/docker/daemon.json > "$config"
        else
          jq -n --arg root "$docker_data_root" \
            '{"data-root": $root}' > "$config"
        fi

        sudo dockerd --validate --config-file="$config"
        sudo systemctl stop docker.service docker.socket
        sudo install -m 0644 "$config" /etc/docker/daemon.json

        if ! sudo systemctl start docker.service; then
          echo "::error::Docker failed to start with its temporary-disk configuration"
          if [ "$had_config" = true ]; then
            sudo install -m 0644 "$backup" /etc/docker/daemon.json
          else
            sudo rm -f /etc/docker/daemon.json
          fi
          sudo systemctl start docker.service || true
          exit 1
        fi

        actual_root="$(docker info --format '{{.DockerRootDir}}')"
        if [ "$actual_root" != "$docker_data_root" ]; then
          echo "::error::Expected Docker root $docker_data_root, got $actual_root"
          exit 1
        fi

        echo "Docker root: $actual_root"
        findmnt -T "$actual_root"
        df -hT "$actual_root"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      with:
        driver-opts: image=mcr.microsoft.com/oss/v2/moby/buildkit:v0.18.1
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 1
    
    - name: 'Login the ACR'
      run: |
        az login --identity 
        az acr login -n ${{ secrets.AZURE_REGISTRY }}
    
    - name: Build and publish cluster-health-monitor
      if: ${{ inputs.publishClusterHealthMonitor }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/cluster-health-monitor.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ secrets.AZURE_REGISTRY }}/${{ env.REGISTRY_REPO}}/${{ env.CLUSTER_HEALTH_MONITOR_IMAGE_NAME }}:${{ needs.prepare-variables.outputs.release_tag }}

    - name: Build and publish cluster-health-monitor-gpu
      if: ${{ inputs.publishGpuChecker }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/cluster-health-monitor-gpu.Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ secrets.AZURE_REGISTRY }}/${{ env.REGISTRY_REPO}}/${{ env.GPU_CHECKER_IMAGE_NAME }}:${{ needs.prepare-variables.outputs.release_tag }}

    - name: Show final disk usage
      if: ${{ always() }}
      run: |
        echo "================ FILESYSTEMS ================"
        df -hT || true

        echo "================ WORKSPACE FILESYSTEM ================"
        findmnt -T "$GITHUB_WORKSPACE" || true

        echo "================ DOCKER STORAGE ================"
        docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
        if [ -n "$docker_root" ]; then
          echo "Docker root: $docker_root"
          findmnt -T "$docker_root" || true
          df -hT "$docker_root" || true
        else
          echo "Docker root unavailable"
        fi
        docker system df || true

        echo "================ BUILDX STORAGE ================"
        docker buildx du || true
