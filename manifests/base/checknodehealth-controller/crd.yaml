---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: checknodehealths.clusterhealthmonitor.azure.com
spec:
  group: clusterhealthmonitor.azure.com
  names:
    kind: CheckNodeHealth
    listKind: CheckNodeHealthList
    plural: checknodehealths
    shortNames:
    - cnh
    singular: checknodehealth
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeRef.name
      name: Node
      type: string
    - jsonPath: .status.conditions[?(@.type=="Healthy")].status
      name: Healthy
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CheckNodeHealth is a one-time health check resource for a specific node.
          When created, the controller runs health checks on the target node and updates
          the status with results. The resource is not modified after completion.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CheckNodeHealthSpec defines the desired state of CheckNodeHealth
            properties:
              checks:
                description: |-
                  Checks optionally requests additional, on-demand checks to run on the node,
                  beyond the controller's built-in checks. Each entry runs as its own pod on the
                  target node and produces a CheckResult with the same Name in the status.

                  This is the extension point for intrusive checks (e.g. GPU diagnostics): the
                  requester supplies the image and parameters; the controller owns the pod's
                  security/scheduling shape via Profile.
                items:
                  description: NodeCheckSpec defines a single on-demand check to run
                    on the target node.
                  properties:
                    args:
                      description: |-
                        Args are appended to the check container's command, allowing per-request
                        customization such as test selection or run level.
                      items:
                        type: string
                      type: array
                    enforcement:
                      default: Advisory
                      description: |-
                        Enforcement controls whether this check's result contributes to the node's overall
                        Healthy verdict. Advisory (default) records the result but excludes it from the
                        rollup. Enforcing lets the result flip Healthy.
                      enum:
                      - Advisory
                      - Enforcing
                      type: string
                    image:
                      description: |-
                        Image optionally overrides the container image for this check. When empty, the
                        controller-configured default image for the selected Profile is used. Must be a
                        pinned, digest- or tag-referenced image the cluster is allowed to pull.
                      maxLength: 1024
                      type: string
                    name:
                      description: |-
                        Name uniquely identifies this check within the request and is echoed back on the
                        corresponding CheckResult.Name so results correlate to requests.
                      maxLength: 253
                      pattern: ^[A-Z][a-zA-Z0-9]*$
                      type: string
                    preemption:
                      default: NonPreemptible
                      description: |-
                        Preemption selects whether an arriving customer GPU workload may preempt (evict) this
                        check. On-demand/investigative checks typically run to completion (NonPreemptible),
                        while periodic/background checks yield to customer work (Preemptible). Either way the
                        check remains bounded by Timeout.
                      enum:
                      - Preemptible
                      - NonPreemptible
                      type: string
                    profile:
                      description: |-
                        Profile selects a controller-defined execution profile (pod security context, device
                        requests, host mounts, tolerations, isolation, default image, and default timeout).
                        Requesters cannot craft an arbitrary privileged pod; they may only select a profile
                        the controller supports.
                      enum:
                      - GPUIntrusive
                      type: string
                    timeout:
                      description: |-
                        Timeout bounds how long the check may run before it is recorded as a timeout
                        (Status=Unknown, ErrorCode=Timeout). Defaults to the profile's controller-configured
                        timeout.
                      type: string
                  required:
                  - name
                  - profile
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              nodeRef:
                description: NodeRef references the node to check
                properties:
                  name:
                    description: Name is the name of the node
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - nodeRef
            type: object
          status:
            description: CheckNodeHealthStatus defines the observed state of CheckNodeHealth
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the check's current state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              finishedAt:
                description: FinishedAt is the timestamp when the health checks completed
                format: date-time
                type: string
              results:
                description: Results contains the individual check results
                items:
                  description: CheckResult represents the result of a single health
                    check
                  properties:
                    errorCode:
                      description: ErrorCode is the specific error code if the status
                        is not Healthy
                      maxLength: 253
                      pattern: ^[A-Z][a-zA-Z0-9]*$
                      type: string
                    message:
                      description: Message provides additional details about the check
                        result
                      maxLength: 32768
                      type: string
                    name:
                      description: |-
                        Name is the specific instance name of the health check
                        For example: "PodStartup", "PodNetwork"
                      maxLength: 253
                      pattern: ^[A-Z][a-zA-Z0-9]*$
                      type: string
                    status:
                      description: Status is the health status of this check
                      enum:
                      - Healthy
                      - Unhealthy
                      - Unknown
                      type: string
                    subResults:
                      description: |-
                        SubResults optionally breaks this check into its constituent sub-checks (e.g. GPU
                        diagnostic plugins), each with its own status and detail. This preserves granular
                        diagnostics on the CR after the check pod is deleted.
                      items:
                        description: SubCheckResult is one granular sub-check within
                          a CheckResult.
                        properties:
                          errorCode:
                            description: ErrorCode is a stable, machine-readable code
                              when Status is not Healthy.
                            maxLength: 253
                            pattern: ^[A-Z][a-zA-Z0-9]*$
                            type: string
                          message:
                            description: Message provides human-readable detail about
                              the sub-check result.
                            maxLength: 32768
                            type: string
                          name:
                            description: Name identifies the sub-check within the
                              parent CheckResult.
                            maxLength: 253
                            type: string
                          observations:
                            additionalProperties:
                              type: string
                            description: |-
                              Observations optionally carries measured values the check emitted, e.g.
                              {"bandwidthGBps": "335", "eccErrors": "0"}.
                            type: object
                          status:
                            description: Status is the health status of this sub-check.
                            enum:
                            - Healthy
                            - Unhealthy
                            - Unknown
                            type: string
                        required:
                        - name
                        - status
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                  required:
                  - name
                  - status
                  type: object
                type: array
              startedAt:
                description: StartedAt is the timestamp when the health checks started
                format: date-time
                type: string
            required:
            - startedAt
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
