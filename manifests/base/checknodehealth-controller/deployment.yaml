---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checknodehealth-controller
  namespace: kube-system
  labels:
    app: checknodehealth-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checknodehealth-controller
  template:
    metadata:
      labels:
        app: checknodehealth-controller
    spec:
      serviceAccountName: checknodehealth-controller
      containers:
        - name: controller
          image: mcr.microsoft.com/aks/cluster-health-monitor/cluster-health-monitor:v0.0.42
          command: ["/controller"]
          args:
            - "-v=5"
            - "-metrics-bind-address=:8080"
            - "-enable-gpu-checks"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: metrics
          env:
            - name: CHECKER_POD_IMAGE
              value: "mcr.microsoft.com/aks/cluster-health-monitor/cluster-health-monitor:v0.0.42"
            - name: GPU_CHECKER_POD_IMAGE
              value: "mcr.microsoft.com/aks/cluster-health-monitor/cluster-health-monitor-gpu:v0.0.42"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
