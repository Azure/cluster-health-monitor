- op: test
  path: /spec/template/spec/containers/0/name
  value: controller
- op: replace
  path: /spec/template/spec/containers/0/image
  value: cluster-health-monitor:test-latest
- op: replace
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: IfNotPresent
- op: replace
  path: /spec/template/spec/containers/0/env/0/value
  value: cluster-health-monitor:test-latest
- op: test
  path: /spec/template/spec/containers/0/env/1/name
  value: GPU_CHECKER_POD_IMAGE
- op: replace
  path: /spec/template/spec/containers/0/env/1/value
  value: cluster-health-monitor-gpu-e2e:test-latest
# GPU checks are enabled in base, but the GPU e2e suite toggles them on only for itself.
- op: test
  path: /spec/template/spec/containers/0/args/2
  value: "-enable-gpu-checks"
- op: remove
  path: /spec/template/spec/containers/0/args/2
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "-enable-node-reboot-check"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "-enable-health-check-request"
